services:
  postgres:
    image: postgres:16-alpine
    container_name: grpc-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: productinfo
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - grpc-network
  
volumes:
  postgres_data:

networks:
  grpc-network:
    driver: bridge 